[metadata]
name = eaopack
version = 3.1.5
author = RIVACON
description = A Framework for Optimizing Energy Portfolios
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/RIVACON/EAO
#project_urls =
#    Bug Tracker = ...
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.10
install_requires =
    numpy <= 2.5.1
    pandas <= 3.03
    pytz <= 2026.2  
    scipy <= 1.18.0
    openpyxl <= 3.1.5
    cvxpy <= 1.9.2
    cvxopt <= 1.3.3
    pyscipopt <= 6.2.1
    highspy <= 1.15.1
    networkx <= 3.6.1
    matplotlib <= 3.11.1        
[options.packages.find]
exclude =
    tests
    doc
