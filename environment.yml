# packages needed for EAO development and testing
name: eao_env

channels:
  - conda-forge
  - nodefaults
  #  - defaults

dependencies:
  - python<=3.13.14
  - pip
  - jupyter
  - pytest <= 9.1.1
  - pytest-cov <= 7.1.0
  - numpy <= 2.5.1
  - pandas <= 3.03
  - pytz <= 2026.6.3
  - scipy <= 1.18.0
  - openpyxl <= 3.1.5
  - cvxpy <= 1.9.2
  - cvxopt <= 1.3.3
  - pyscipopt <= 6.2.1
  - highspy <= 1.15.1
  - networkx <= 3.6.1
  - matplotlib <= 3.11.1    
